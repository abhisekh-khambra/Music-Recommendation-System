server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: music-recommendation

  # ── Multipart uploads (voice + conversation audio) ───────────
  servlet:
    multipart:
      max-file-size: 25MB      # matches Groq Whisper's own 25MB upload limit
      max-request-size: 26MB

  # ── Local secrets (GROQ_API_KEY, DB_USERNAME, DB_PASSWORD, ...) ──
  # Loaded from backend/.env if present (gitignored, never committed).
  # Values already set as real OS environment variables still win over this file.
  config:
    import: optional:file:.env[.properties]

  # ── MySQL DataSource ─────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/music_rec_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:5503}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update            # auto-creates/updates tables on startup
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true  # run DataInitializer AFTER Hibernate creates tables

  # ── SQL Init (data.sql auto-seeding handled by DataInitializer) ──
  sql:
    init:
      mode: never

  # ── Spring AI → Groq (OpenAI-compatible endpoint) ────────────
  ai:
    openai:
      # Set GROQ_API_KEY as an environment variable before running the backend
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai

      chat:
        options:
          # llama3-70b-8192 and llama-3.3-70b-versatile were both since removed from
          # this account's Groq catalog (confirmed via GET /openai/v1/models) — verify
          # against that endpoint again if this model ever 404s as model_not_found.
          # gpt-oss is a reasoning model: it spends completion tokens on hidden
          # "reasoning" before the JSON content, so max-tokens must cover both, and
          # reasoning-effort=low keeps that hidden spend small and predictable.
          model: openai/gpt-oss-120b
          temperature: 0.7
          max-tokens: 4096
          reasoning-effort: low

      audio:
        transcription:
          base-url: https://api.groq.com/openai
          api-key: ${GROQ_API_KEY}
          options:
            model: whisper-large-v3        # Groq's Whisper model

# ── Application-level Settings ──────────────────────────────────
app:
  recommendation:
    candidate-pool-size: 30         # How many tracks to retrieve before reranking
    rerank-pool-size: 15            # Shortlist size after the lightweight reranker, before the LLM
    top-n-results: 10               # Final recommendations count
    fallback-to-keyword: true       # Use keyword fallback if LLM fails
  audio:
    # ffmpeg is required to decode uploaded audio (WebM/MP3/M4A/...) into raw PCM for the
    # acoustic (pitch/energy) emotion + speaker-diarization analysis — see com.musicrec.audio.
    # Install it and ensure it's on PATH, or point this at a specific binary. Voice/conversation
    # transcription itself (Groq Whisper) does NOT depend on this — only the acoustic analysis does;
    # everything degrades gracefully to text-only analysis if ffmpeg isn't available.
    ffmpeg-path: ${FFMPEG_PATH:C:/Users/LENOVO/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-9.0.2-full_build/bin/ffmpeg.exe}
    transcode-timeout-seconds: 30
  ser:
    # Local speech-emotion service (ser-service/, Python): emotion from the voice + speaker voiceprints.
    # Optional — when it isn't running, voice/conversation fall back to text + pitch analysis and say so.
    url: ${SER_URL:http://127.0.0.1:8090}
    enabled: true
    timeout-seconds: 120
    # Voice weight when fusing with the words: 0 = words only, 1 = voice only. Kept below 0.5 because the
    # model (trained on acted English speech) was confidently wrong on the test audio; requests can still
    # choose emotionSource=VOICE. See docs/ARCHITECTURE.md.
    audio-weight: 0.3
    voice-text-confidence: 0.6
  evaluation:
    # Labelled conversation dataset and report output for POST /api/v1/evaluation/run
    # (paths relative to the backend/ directory the app is started from).
    dataset-path: ${EVAL_DATASET_PATH:../evaluation/dataset/conversations.json}
    results-dir: ${EVAL_RESULTS_DIR:../evaluation/results}
    # Pause between cases to stay under Groq's per-minute token limit (8k TPM on the free tier;
    # one case is ~3 LLM calls, ~5k tokens). A case that still hits a fallback is re-run once
    # after the per-minute window resets.
    delay-between-cases-ms: 30000
    retry-wait-ms: 65000
    max-attempts: 2

# ── Logging ─────────────────────────────────────────────────────
logging:
  level:
    com.musicrec: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
